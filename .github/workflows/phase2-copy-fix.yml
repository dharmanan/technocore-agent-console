name: Apply Phase 2 copy refinement

on:
  push:
    paths:
      - .github/workflows/phase2-copy-fix.yml

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Phase 2 labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()
          text = text.replace('tx("Claim + spend", "Al + harca")', 'tx("Claim → spend on inference", "Al → inference için harca")')
          text = text.replace('tx("Primary agent metric", "Ana agent metriği")', 'tx("Primary airdrop metric", "Airdrop ana metriği")')
          path.write_text(text)
          PY
          rm .github/workflows/phase2-copy-fix.yml
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/phase2-copy-fix.yml
          git commit -m "refine Phase 2 metric labels"
          git push
